services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb}
      POSTGRES_DB: ${POSTGRES_DB:-wb}
    ports:
      - "5432:5432"
    volumes:
      - wb-postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wb} -d ${POSTGRES_DB:-wb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - wb-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wblocal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wblocalsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wb-minio:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-wb}:${POSTGRES_PASSWORD:-wb}@postgres:5432/${POSTGRES_DB:-wb}
      WEB_ORIGIN: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-WB <onboarding@example.com>}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_ORIGIN: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  wb-postgres:
  wb-redis:
  wb-minio:
